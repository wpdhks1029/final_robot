follower_amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: follower/base_link
    odom_frame_id: follower/odom
    global_frame_id: map
    scan_topic: /follower/scan
    map_topic: /follower/localization_map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    set_initial_pose: false
    first_map_only: true
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_model_type: likelihood_field
    update_min_d: 0.2
    update_min_a: 0.2
    transform_tolerance: 1.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
